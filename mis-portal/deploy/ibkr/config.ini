# IBC config TEMPLATE for the headless IB Gateways that back the IBKR streaming daemon.
# There are FOUR logins (SDR, DHR, DHR_2, HHR) = four Gateway sessions, so make ONE copy
# per login and set OverrideTwsApiPort to that login's port:
#     /opt/ibc/config.sdr.ini    OverrideTwsApiPort=4001
#     /opt/ibc/config.dhr.ini    OverrideTwsApiPort=4003
#     /opt/ibc/config.dhr_2.ini  OverrideTwsApiPort=4005
#     /opt/ibc/config.hhr.ini    OverrideTwsApiPort=4007
# (the daemon defaults IBKR_{LOGIN}_IBC_INI to /opt/ibc/config.{login}.ini and the same
# ports; override in .env if you prefer different paths/ports.)
#
# Credentials are intentionally BLANK — ib_async's IBC passes IBKR_{LOGIN}_TWS_USERID /
# IBKR_{LOGIN}_TWS_PASSWORD from /var/www/mis-portal/.env at launch, so no secret is
# checked into git (same blank ini works for every login).

# --- login -----------------------------------------------------------------
IbLoginId=
IbPassword=
TradingMode=live

# --- API socket ------------------------------------------------------------
# Auto-accept the "incoming API connection" dialog so a headless session doesn't
# block on it (removes the need to pre-seed a Trusted IP for 127.0.0.1).
OverrideTwsApiPort=4001
AcceptIncomingConnectionAction=accept
AllowBlindTrading=no
# ReadOnlyApi: leave blank to honour the Gateway's own setting. The daemon connects
# read-only by default (IBKR_READONLY=true); flip both only when you intend to trade.
ReadOnlyApi=

# --- keep it alive & headless ---------------------------------------------
IbAutoClosedown=no
ClosedownAt=
DismissPasswordExpiryWarning=yes
DismissNSEComplianceNotice=yes
AcceptNonBrokerageAccountWarning=yes
MinimizeMainWindow=yes

# --- daily 2FA / forced restart (IBKR restarts the session ~once a day) -----
# Re-login automatically instead of exiting; the daemon's Watchdog then reconnects.
ReloginAfterSecondFactorAuthenticationTimeout=yes
ExitAfterSecondFactorAuthenticationTimeout=no
# Optional: pin the auto-restart to a quiet time (24h, Gateway's local tz). Leave
# blank to let IBKR drive it.
AutoRestartTime=
