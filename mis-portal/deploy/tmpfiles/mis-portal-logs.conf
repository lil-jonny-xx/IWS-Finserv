# systemd-tmpfiles: guarantee every mis-portal worker log file exists and is
# SAdmin-writable. /var/log is root-owned and NOT writable by SAdmin, so any cron
# line whose `>> /var/log/...log` target does not already exist dies SILENTLY at the
# shell redirect (the command never runs). This provisions them so a new/rescheduled
# worker can never silently fail that way again.
#
# Install:  sudo install -m0644 mis-portal-logs.conf /etc/tmpfiles.d/mis-portal-logs.conf
#           sudo systemd-tmpfiles --create /etc/tmpfiles.d/mis-portal-logs.conf
# (systemd also re-applies this at every boot.)
#
# Type 'f' creates the file if missing with the given mode/owner and leaves an
# existing file untouched (no truncation).
#
#Type Path                                        Mode Owner  Group  Age Argument
f /var/log/mis-portal-broker-txn-sync.log         0640 SAdmin SAdmin -   -
f /var/log/mis-portal-equity-metrics.log          0640 SAdmin SAdmin -   -
f /var/log/mis-portal-staleness.log               0640 SAdmin SAdmin -   -
f /var/log/mis-portal-equity-token.log            0640 SAdmin SAdmin -   -
f /var/log/mis-portal-equity-sync.log             0640 SAdmin SAdmin -   -
f /var/log/mis-portal-ibkr-stream.log             0640 SAdmin SAdmin -   -
